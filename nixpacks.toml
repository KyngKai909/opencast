[phases.setup]
# ffmpeg: media preparation, previews, playout. yt-dlp: link imports (the API).
nixPkgs = ["nodejs_22", "ffmpeg", "yt-dlp"]

[phases.install]
# Dev dependencies too: the build needs TypeScript and Vite, and migrations run with tsx.
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start:railway"
